<body>
    <h1>My Store</h1>
    <table border="1">
        <thead>
            <th>Item photo</th>
            <th>Name</th>
            <th>Price</th>
        </thead>
        <tbody>
            <tr>
                <td><img src="/images/cam.jpg" width="250" alt=""></td>
                <td>Oranges</td>
                <td>&dollar;1 ea.</td>
            </tr>
            <tr>
                <td><img src="banana" alt=""></td>
                <td>Bananas</td>
                <td>&dollar;0.75/lb</td>
            </tr>
            <tr>
                <td><img src="/images/Lựu.jpg" width="300" alt=""></td>
                <td>Pomegranates</td>
                <td>3 for &dollar;5</td>
            </tr>
            <tr>
                <td><img src="gummy bear" alt=""></td>
                <td>Gummy bears</td>
                <td>&dollar;6 for bag</td>
            </tr>
            <tr>
                <td><img src="/images/bông cải xanh.jpg" width="300"></td>
                <td>Broccoli</td>
                <td>&dollar;3 a head</td>
            </tr>
        </tbody>
    </table>

    <h1>Booking Form</h1>
    <form action="">
        <label for="">Name:</label>
        <input type="text"> <br>
        <label for="">Email:</label>
        <input type="text"> <br>
        <label for="">Phone:</label>
        <input type="number"> <br>
        <label for="">Date:</label>
        <input type="date"> <br>
        <label for="">Time:</label>
        <input type="time"> <br>
        <label for="">Number of guests:</label>
        <input type="number">
        <br><button>Submit</button>
    </form>

    <h1>Car Purchase Form</h1>
    <form action="">
        <label for="">Name:</label>
        <input type="text"> <br>
        <label for="">Email:</label>
        <input type="text"> <br>
        <label for="">Phone:</label>
        <input type="number"> <br>
        <label for="">Choose a Car:</label>
        <select name="" id="">
            <option value="">Lexus</option>
            <option value="">Nissan</option>
            <option value="">Toyata</option>
        </select> <br>
        <label for="">Choose a Color</label>
        <select name="" id="">
            <option value="">Red</option>
            <option value="">Yellow</option>
            <option value="">Black</option>
            <option value="">White</option>
        </select> <br>
        <label for="">Quantity:</label>
        <input type="text"> <br>
        <label for="">Delivery Date:</label>
        <input type="date"> <br>
        <button>Submit</button>
    </form>
</body>
</html>
